<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img"><title>从一件工作开始</title><rect width="900" height="430" rx="20" fill="#f0f3e9"/><g font-family="Microsoft YaHei,PingFang SC,sans-serif"><text x="46" y="64" fill="#234b3d" font-size="29">从一件工作开始</text><text x="46" y="104" fill="#78836d" font-size="16">原创流程示意 · 按顺序判断，未完成处保留记录</text><rect x="46" y="151" width="184" height="192" rx="18" fill="#234b3d" stroke="#d5decb"/><text x="66" y="190" fill="#d9ec93" font-size="17">01</text><text x="66" y="242" fill="#fff" font-size="22">确定任务</text><text x="66" y="290" fill="#d9e4d2" font-size="14">一页公开资料</text><text x="234" y="258" fill="#234b3d" font-size="19">→</text><rect x="254" y="151" width="184" height="192" rx="18" fill="#fff" stroke="#d5decb"/><text x="274" y="190" fill="#8b9b77" font-size="17">02</text><text x="274" y="242" fill="#234b3d" font-size="22">核对使用条件</text><text x="274" y="290" fill="#748167" font-size="14">地区 · 账号 · 设备</text><text x="442" y="258" fill="#234b3d" font-size="19">→</text><rect x="462" y="151" width="184" height="192" rx="18" fill="#fff" stroke="#d5decb"/><text x="482" y="190" fill="#8b9b77" font-size="17">03</text><text x="482" y="242" fill="#234b3d" font-size="22">检查整理结果</text><text x="482" y="290" fill="#748167" font-size="14">数值 · 条件 · 未知</text><text x="650" y="258" fill="#234b3d" font-size="19">→</text><rect x="670" y="151" width="184" height="192" rx="18" fill="#fff" stroke="#d5decb"/><text x="690" y="190" fill="#8b9b77" font-size="17">04</text><text x="690" y="242" fill="#234b3d" font-size="22">记录完整成本</text><text x="690" y="290" fill="#748167" font-size="14">免费是否够用</text><text x="46" y="397" fill="#83916f" font-size="15">云居民基础工具指南</text></g></svg>